name: MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Pull data from DVC
      run: |
        pip install dvc[s3]
        dvc pull

    - name: Train model
      run: |
        python src/train.py

    - name: Run basic test
      run: |
        echo "Pipeline executed successfully"
